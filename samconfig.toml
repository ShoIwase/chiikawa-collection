version = 0.1

[default.global.parameters]
stack_name = "chiikawa-collection-app"
region     = "ap-northeast-1"

[default.build.parameters]
cached   = true
parallel = true

[default.deploy.parameters]
capabilities          = "CAPABILITY_IAM"
confirm_changeset     = true
resolve_s3            = true
no_fail_on_empty_changeset = true
# DomainName は CI/CD で --parameter-overrides として渡す
parameter_overrides = [
  "MasterTableName=ChiikawaMaster",
  "CollectionTableName=UserCollection",
  "FamilyId=shoiwase",
]
