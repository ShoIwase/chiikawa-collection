name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Load config from SSM
        run: |
          get() { aws ssm get-parameter --name "$1" --query Parameter.Value --output text; }
          echo "NEXT_PUBLIC_API_URL=$(get /chiikawa/api-url)"                       >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_COGNITO_USER_POOL_ID=$(get /chiikawa/cognito-user-pool-id)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_COGNITO_CLIENT_ID=$(get /chiikawa/cognito-client-id)"   >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_CLOUDFRONT_URL=$(get /chiikawa/cloudfront-url)"         >> "$GITHUB_ENV"
          echo "STATIC_BUCKET=$(get /chiikawa/static-bucket)"                       >> "$GITHUB_ENV"
          echo "CLOUDFRONT_DISTRIBUTION_ID=$(get /chiikawa/cloudfront-distribution-id)" >> "$GITHUB_ENV"

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Sync to S3
        run: |
          aws s3 sync frontend/out/ "s3://$STATIC_BUCKET/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"
          aws s3 sync frontend/out/ "s3://$STATIC_BUCKET/" \
            --delete \
            --cache-control "no-cache" \
            --include "*.html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
