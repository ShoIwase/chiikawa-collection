name: Deploy SAM

on:
  push:
    branches: [main]
    paths:
      - "lambda/**"
      - "template.yaml"
      - "samconfig.toml"
      - ".github/workflows/deploy-sam.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"
          cache: "maven"

      - name: Run Java tests (unit + integration)
        working-directory: lambda/api
        run: mvn test

  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [lambda/scraper, lambda/scanner]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        working-directory: ${{ matrix.dir }}
        run: pip install -r requirements-dev.txt -q

      - name: Run Python tests
        working-directory: ${{ matrix.dir }}
        run: pytest tests/ -v --tb=short

  deploy:
    needs: [test-java, test-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"
          cache: "maven"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: SAM Build
        run: sam build --parallel

      - name: SAM Deploy
        run: |
          sam deploy \
            --no-confirm-changeset \
            --parameter-overrides "DomainName=${{ secrets.DOMAIN_NAME }}"
