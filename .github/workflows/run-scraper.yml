name: Run Scraper (Manual)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  invoke:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Invoke chiikawa-scraper Lambda
        run: |
          aws lambda invoke \
            --function-name chiikawa-scraper \
            --log-type Tail \
            --query 'LogResult' \
            --output text \
            /tmp/out.json | base64 -d
          echo "--- Response ---"
          cat /tmp/out.json
